<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Beer Calorie Estimator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #222;
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #ff9f43;
        }
        .result-container {
            background-color: #fef7f1;
            border-left: 4px solid #ff9f43;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            margin-top: 25px;
        }
        .result-val {
            font-size: 32px;
            font-weight: bold;
            color: #d35400;
            margin: 5px 0;
        }
        .result-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Beer Calorie Estimator</h2>
    
    <!-- Beer Style Dropdown -->
    <div class="input-group">
        <label for="beerStyle">Beer Style</label>
        <select id="beerStyle">
    		<option value="-10">Hard Seltzer (Zero Carbs / Ultra Dry)</option>
   			<option value="0">Crisp / Light Lager (Highly Attenuated)</option>
    		<option value="5">Farmhouse Ale (Very Dry)</option>
    		<option value="10">Session IPA / Session Ale (Light Body)</option>
    		<option value="20" selected>Standard Lager / Ale / West Coast IPA</option>
    		<option value="15">Standard Stout / Porter</option>
    		<option value="45">Hazy IPA / Double IPA (High Residual Carbs)</option>
    		<option value="60">Pastry / Imperial Stout (Very Sweet/Heavy)</option>
			<option value="5">Saison / Gose / Traditional Dry Sour (Very Dry)</option>
			<option value="20">Fruited Sour</option>
			<option value="60">Smoothie Sour (Heavy Sugars & Fruit)</option>
	</select>
    </div>

    <!-- Volume Input -->
    <div class="input-group">
        <label for="volume">Volume (oz)</label>
        <input type="number" id="volume" value="12" min="1" max="64">
    </div>

    <!-- ABV Input -->
    <div class="input-group">
        <label for="abv">Alcohol By Volume (ABV %)</label>
        <input type="number" id="abv" value="6.5" step="0.1" min="0" max="25">
    </div>

    <!-- Display Outputs -->
    <div class="result-container">
        <div class="result-label">Estimated Calories</div>
        <div id="calorieResult" class="result-val">0</div>
        <div id="carbNotice" style="font-size: 13px; color: #555; margin-top: 5px;"></div>
    </div>
</div>

<script>
    // Grab elements from the DOM
    const beerStyleSelect = document.getElementById('beerStyle');
    const volumeInput = document.getElementById('volume');
    const abvInput = document.getElementById('abv');
    const calorieResult = document.getElementById('calorieResult');
    const carbNotice = document.getElementById('carbNotice');

    function calculateCalories() {
        // 1. Get current values from the inputs
        const abv = parseFloat(abvInput.value) || 0;
        const volume = parseFloat(volumeInput.value) || 0;
        
        // We use the dropdown 'value' to pass the style's typical residual sugar calorie modifier
        const residualSugarModifier = parseFloat(beerStyleSelect.value); 

        // 2. Calculate baseline alcohol calories
        // Standard formula mapped to oz: ABV * 2.5 * Volume
        const alcoholCalories = abv * 2.5 * volume;

        // 3. Adjust the residual sugar modifier proportionally to the volume 
        // (Our baseline modifier assumes a standard 12oz pour)
        const adjustedSugarCalories = (residualSugarModifier / 12) * volume;

        // 4. Sum them up
        const totalCalories = Math.round(alcoholCalories + adjustedSugarCalories);

        // 5. Update the UI
        calorieResult.textContent = totalCalories + ' kcal';
        
        if (residualSugarModifier > 0) {
            carbNotice.textContent = `Includes ~${Math.round(adjustedSugarCalories)} kcal from residual carbs/starches.`;
        } else {
            carbNotice.textContent = "Minimal residual carbohydrate impact.";
        }
    }

    // Attach event listeners so it recalculates instantly whenever any input changes
    beerStyleSelect.addEventListener('change', calculateCalories);
    volumeInput.addEventListener('input', calculateCalories);
    abvInput.addEventListener('input', calculateCalories);

    // Run once on load to populate initial values
    calculateCalories();
</script>

</body>
</html>
